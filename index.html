<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZxTV | Sony Sports Ten 3</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; background: #f1f5f9; font-family: Arial, sans-serif; color: #334155; }
        .header { background: white; border-radius: 22px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 2px 10px #00000008; }
        .header h2 { font-size: 18px; margin: 0; }
        .live { background: #fff0f0; color: #e53945; padding: 10px 13px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .player { background: black; width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; margin-bottom: 30px; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        .status { text-align: center; color: #94a3b8; font-size: 13px; padding: 10px; }
        .card { background: white; border-radius: 22px; padding: 30px 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 2px 10px #00000008; }
        .card h3 { font-size: 15px; color: #64748b; margin: 0 0 25px; }
        .btn { display: block; background: #2864e8; color: white; text-decoration: none; padding: 19px 10px; border-radius: 18px; font-weight: bold; }
        .footer { text-align: center; padding: 25px; color: #64748b; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <h2>📺 Sony Sports Ten 3</h2>
        <span class="live">🔴 LIVE</span>
    </header>
    <div class="player">
        <video id="video" controls playsinline autoplay muted></video>
    </div>
    <div class="status" id="status">Connecting to stream server...</div>
    <footer class="footer">
        <h3>ZxTV 📺</h3>
        <p>Live TV Streaming Website</p>
    </footer>
    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const proxyBaseUrl = "https://workers.dev"; 
        const streamSources = [
            "http://42.98.239",
            "https://rangdhanu.live"
        ];
        let currentSourceIndex = 0;
        let hls = null;

        function loadStream(targetStreamUrl) {
            const securedProxyURL = `${proxyBaseUrl}?url=${encodeURIComponent(targetStreamUrl)}`;
            status.textContent = `Processing video route ${currentSourceIndex + 1}...`;
            
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls({ maxMaxBufferLength: 15, enableWorker: true, lowLatencyMode: true });
                hls.loadSource(securedProxyURL);
                hls.attachMedia(video);
            }
        }
        loadStream(streamSources[currentSourceIndex]);
    </script>
</body>
</html>

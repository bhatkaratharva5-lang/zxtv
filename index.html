<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZxTV | Sony Sports Ten 3</title>
    <!-- FIXED: Complete library reference for reliable HLS media rendering -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 15px; background: #f1f5f9; font-family: Arial, sans-serif; color: #334155; }
        .header { background: white; border-radius: 22px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .player { background: black; width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; margin-bottom: 30px; }
        video { width: 100%; height: 100%; display: block; }
        .status { text-align: center; color: #94a3b8; font-size: 13px; padding: 10px; }
    </style>
</head>
<body>
    <div class="player">
        <video id="video" controls playsinline autoplay muted></video>
    </div>
    <div class="status" id="status">Connecting to stream server...</div>

    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const proxyBaseUrl = "https://workers.dev"; 
        const streamSources = [
            "http://42.98.239",
            "https://rangdhanu.live"
        ];
        let currentSourceIndex = 0;
        let hls = null;

        function loadStream(targetStreamUrl) {
            const securedProxyURL = `${proxyBaseUrl}?url=${encodeURIComponent(targetStreamUrl)}`;
            status.textContent = `Processing video route ${currentSourceIndex + 1}...`;
            
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        if (!url.startsWith(proxyBaseUrl)) {
                            xhr.open('GET', `${proxyBaseUrl}?url=${encodeURIComponent(url)}`, true);
                        }
                    }
                });
                hls.loadSource(securedProxyURL);
                hls.attachMedia(video);
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) handleFallback();
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = securedProxyURL;
            }
        }

        function handleFallback() {
            currentSourceIndex++;
            if (currentSourceIndex < streamSources.length) {
                loadStream(streamSources[currentSourceIndex]);
            } else {
                status.textContent = "Streaming source network error.";
            }
        }

        loadStream(streamSources[currentSourceIndex]);
    </script>
</body>
</html>
